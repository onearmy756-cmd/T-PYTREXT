<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<title>🌍 WORLD GAME CHANGER — T-PYTREXT</title>
<style>
:root {
  --gold: #f0c040; --gold2: #f7d774; --bg: #0a0a0f;
  --neon: #00d4ff; --purple: #a855f7; --green: #22d3a0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1080px;height:1920px;overflow:hidden;
  background:var(--bg);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  perspective:1200px;
}
.scene{position:relative;width:100%;height:100%}

/* Particle background */
.particles{position:absolute;inset:0;overflow:hidden}
.p{position:absolute;border-radius:50%;animation:float linear infinite;opacity:0}
@keyframes float{
  0%{transform:translateY(1920px) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-100px) scale(1.5);opacity:0}
}

/* Central 3D Card */
.card-wrap{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:800px;height:500px;perspective:1500px;
  animation:cardFloat 4s ease-in-out infinite;
}
@keyframes cardFloat{
  0%,100%{transform:translate(-50%,-50%) translateY(0)}
  50%{transform:translate(-50%,-50%) translateY(-15px)}
}
.card3d{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  animation:spin3d 12s linear infinite;
}
@keyframes spin3d{
  0%{transform:rotateY(0deg) rotateX(5deg)}
  100%{transform:rotateY(360deg) rotateX(5deg)}
}
.face{
  position:absolute;width:100%;height:100%;border-radius:30px;
  backface-visibility:hidden;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  border:2px solid rgba(240,192,64,0.2);
  box-shadow:0 30px 80px rgba(0,0,0,0.7),0 0 100px rgba(240,192,64,0.05);
  overflow:hidden;
}
.front{background:linear-gradient(145deg,#111827,#1a1a2e,#0f0f23)}
.front::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,0.04) 0%,transparent 60%);
}
.back{
  background:linear-gradient(145deg,#111827,#1a1a2e);
  transform:rotateY(180deg);
}
.back::before{
  content:'';position:absolute;inset:15px;border-radius:20px;
  border:1px dashed rgba(240,192,64,0.15);
}

.logo-icon{
  font-size:80px;margin-bottom:20px;z-index:2;
  filter:drop-shadow(0 0 30px rgba(240,192,64,0.4));
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.brand{
  font-size:90px;font-weight:900;letter-spacing:8px;z-index:2;
  background:linear-gradient(135deg,#f7d774 0%,#f0c040 30%,#c8960c 50%,#f0c040 70%,#f7d774 100%);
  background-size:200% auto;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:0% center}100%{background-position:200% center}}

.sub{font-size:18px;color:rgba(255,255,255,0.5);letter-spacing:10px;z-index:2;text-transform:uppercase;margin-top:8px}

.tech-row{display:flex;gap:16px;margin-top:20px;z-index:2}
.tech{font-size:14px;letter-spacing:2px;padding:8px 20px;border-radius:25px;
  font-weight:700;text-transform:uppercase;border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.02)}
.t1{color:#ffd43b;border-color:rgba(255,212,59,0.3)}.t2{color:#f74c00;border-color:rgba(247,76,0,0.3)}
.t3{color:#a855f7;border-color:rgba(168,85,247,0.3)}.t4{color:#22d3a0;border-color:rgba(34,211,160,0.3)}

/* TOP TEXT */
.top-text{
  position:absolute;top:120px;left:50%;transform:translateX(-50%);z-index:10;
  text-align:center;width:100%;
}
.top-text .line1{
  font-size:28px;color:rgba(255,255,255,0.4);letter-spacing:15px;
  text-transform:uppercase;animation:fadeInDown 1s ease;
}
.top-text .line2{
  font-size:120px;font-weight:900;letter-spacing:12px;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#f0c040 50%,#c8960c 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:titleGlow 2s ease-in-out infinite;
  margin-top:10px;
}
@keyframes titleGlow{
  0%,100%{filter:drop-shadow(0 0 20px rgba(240,192,64,0.3))}
  50%{filter:drop-shadow(0 0 40px rgba(240,192,64,0.6))}
}
@keyframes fadeInDown{
  0%{opacity:0;transform:translateY(-30px)}100%{opacity:1;transform:translateY(0)}
}

/* BOTTOM TEXT */
.bottom-text{
  position:absolute;bottom:180px;left:50%;transform:translateX(-50%);z-index:10;
  text-align:center;width:90%;
}
.bottom-text .main{
  font-size:70px;font-weight:900;letter-spacing:8px;line-height:1.1;
  background:linear-gradient(135deg,#ffd700,#ff8c00,#ffd700);
  background-size:200% auto;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 2s linear infinite;
}
.bottom-text .sub2{
  font-size:22px;color:rgba(255,255,255,0.35);letter-spacing:20px;
  margin-top:15px;text-transform:uppercase;
}

/* STATS */
.stats{
  position:absolute;bottom:350px;left:50%;transform:translateX(-50%);
  display:flex;gap:40px;z-index:10;
}
.stat-box{
  text-align:center;padding:15px 25px;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);
  border-radius:20px;
}
.stat-box .val{font-size:40px;font-weight:900;color:var(--gold)}
.stat-box .lbl{font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:3px;text-transform:uppercase;margin-top:5px}

/* CREDIT */
.credit{
  position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:10;
  font-size:20px;color:rgba(255,255,255,0.25);letter-spacing:6px;text-transform:uppercase;
}

/* REFLECTION */
.reflect{
  position:absolute;bottom:200px;left:50%;transform:translateX(-50%);
  width:600px;height:80px;opacity:0.15;
  background:linear-gradient(to bottom,rgba(240,192,64,0.2),transparent);
  border-radius:50%;filter:blur(20px);
  animation:reflectPulse 3s ease-in-out infinite;
}
@keyframes reflectPulse{0%,100%{opacity:0.1;transform:translateX(-50%) scaleX(0.9)}50%{opacity:0.25;transform:translateX(-50%) scaleX(1.1)}}

/* RINGS */
.ring{position:absolute;border-radius:50%;border:1px solid rgba(240,192,64,0.08);pointer-events:none}
.ring1{width:900px;height:900px;top:50%;left:50%;transform:translate(-50%,-50%);animation:ringSpin 20s linear infinite}
.ring2{width:700px;height:700px;top:50%;left:50%;transform:translate(-50%,-50%);animation:ringSpin 15s linear infinite reverse}
.ring3{width:500px;height:500px;top:50%;left:50%;transform:translate(-50%,-50%);animation:ringSpin 10s linear infinite}
@keyframes ringSpin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}

/* FLAG */
.flag{position:absolute;top:80px;right:80px;font-size:60px;z-index:10;animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="scene">
  <!-- Rings -->
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Flag -->
  <div class="flag">🇹🇿</div>

  <!-- Top Text -->
  <div class="top-text">
    <div class="line1">Introducing</div>
    <div class="line2">PYTREX</div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-box"><div class="val">34K+</div><div class="lbl">Lines</div></div>
    <div class="stat-box"><div class="val">220+</div><div class="lbl">Classes</div></div>
    <div class="stat-box"><div class="val">10</div><div class="lbl">Demos</div></div>
    <div class="stat-box"><div class="val">96</div><div class="lbl">Tests</div></div>
  </div>

  <!-- Card -->
  <div class="card-wrap">
    <div class="card3d">
      <div class="face front">
        <div class="logo-icon">⚡</div>
        <div class="brand">T-PYTREXT</div>
        <div class="sub">Python · Rust · Elixir · AI</div>
        <div class="tech-row">
          <span class="tech t1">Python</span>
          <span class="tech t2">Rust</span>
          <span class="tech t3">Elixir</span>
          <span class="tech t4">AI/ML</span>
        </div>
      </div>
      <div class="face back">
        <div class="logo-icon" style="font-size:50px">🌍</div>
        <div style="color:var(--gold);font-size:36px;font-weight:800;letter-spacing:6px">WORLD FIRST</div>
        <div style="color:rgba(255,255,255,0.3);font-size:16px;letter-spacing:4px;margin-top:15px;text-align:center;line-height:2">
          Python + Tauri + Elixir<br>
          Blockchain + AI + MCP<br>
          ALL IN ONE FRAMEWORK
        </div>
      </div>
    </div>
  </div>
  <div class="reflect"></div>

  <!-- Bottom Text -->
  <div class="bottom-text">
    <div class="main">WORLD GAME CHANGER</div>
    <div class="sub2">Built in Tanzania · For the World</div>
  </div>

  <!-- Credit -->
  <div class="credit">DR MBILINYI · 2026</div>
</div>

<script>
// Particles
const container = document.getElementById('particles');
const colors = ['#f0c040','#00d4ff','#a855f7','#22d3a0','#f472b6','#ff8c00'];
for(let i=0;i<80;i++){
  const p=document.createElement('div');
  p.className='p';
  p.style.left=Math.random()*100+'%';
  p.style.width=p.style.height=(Math.random()*3+2)+'px';
  p.style.background=colors[Math.floor(Math.random()*colors.length)];
  p.style.animationDuration=(Math.random()*8+6)+'s';
  p.style.animationDelay=(Math.random()*8)+'s';
  container.appendChild(p);
}
</script>
</body>
</html>
