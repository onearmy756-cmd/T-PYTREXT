[package]
name = "mtechos-ide"
version = "0.1.0"
description = "MBILINYITECH IDE — Tauri 2 desktop (Rust + existing agent UI)"
authors = ["Mbilinyi Tech"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mtechos_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
