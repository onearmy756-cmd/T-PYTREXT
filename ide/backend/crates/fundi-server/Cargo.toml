[package]
name = "fundi-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "HTTP/WebSocket API server for Fundi Agent"

[features]
default = []
otlp = ["fundi-telemetry/otlp"]

[[bin]]
name = "fundi-server"
path = "src/main.rs"

[dependencies]
fundi-core = { workspace = true }
fundi-transport = { workspace = true }
fundi-agent = { workspace = true }
fundi-tools = { workspace = true }
fundi-config = { workspace = true }
fundi-cron = { workspace = true }
fundi-skills = { workspace = true }
fundi-environments = { workspace = true }
fundi-telemetry = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }
libc = "0.2"
reqwest = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tracing-subscriber = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
