[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t-pytrext"
version = "1.0.0"
description = "T-PYTREXT: Full-Stack AI & Real-Time Desktop Framework (Python + Rust + Elixir + Tauri v2)"
readme = "README.md"
authors = [
    { name = "DR MBILINYI", email = "onearmy756@github.com" }
]
maintainers = [
    { name = "DR MBILINYI" }
]
requires-python = ">=3.10"
license = { text = "AGPL-3.0 OR Commercial" }
keywords = [
    "framework", "desktop", "tauri", "rust", "elixir", "python",
    "blockchain", "AI", "machine-learning", "encryption", "real-time",
    "full-stack", "desktop-app", "cross-platform", "fintech"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Desktop Environment",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "websockets>=11.0",
    "click>=8.0",
    "msgpack>=1.0",
    "transformers>=4.30.0",
    "watchdog>=3.0.0",
    "keyring>=24.0.0",
    "bcrypt>=4.0.0",
    "fpdf2>=2.7.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "maturin>=1.0",
]
finetune = [
    "transformers>=4.30.0",
    "datasets>=2.0.0",
    "accelerate>=0.20.0",
]
rust = [
    "maturin>=1.0",
]
all = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "maturin>=1.0",
    "datasets>=2.0.0",
    "accelerate>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/onearmy756-cmd/T-PYTREXT"
Documentation = "https://github.com/onearmy756-cmd/T-PYTREXT#readme"
Repository = "https://github.com/onearmy756-cmd/T-PYTREXT.git"
Issues = "https://github.com/onearmy756-cmd/T-PYTREXT/issues"
"Commercial License" = "https://github.com/onearmy756-cmd/T-PYTREXT/blob/master/COMMERCIAL_LICENSE.md"

[project.scripts]
pytrex = "pytrex.cli:main"

[tool.setuptools]
packages = ["pytrex"]

[tool.setuptools.package-data]
pytrex = ["templates/**/*", "templates/frontend/*"]

[tool.maturin]
features = ["pyo3/extension-module"]
include = ["pytrex_engine/_build/prod/rel/pytrex_engine/**/*"]
