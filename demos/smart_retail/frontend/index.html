<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PyTreX Smart Retail POS</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 { color: #38bdf8; margin: 0; }
        .header p { color: #94a3b8; margin: 5px 0 0 0; }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
        }
        .panel h2 { color: #38bdf8; font-size: 18px; margin-top: 0; }
        button {
            padding: 12px 20px;
            background: #0ea5e9;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #0284c7; }
        .scan-area {
            background: #020617;
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: #64748b;
            margin-bottom: 15px;
        }
        #detected_items { margin-top: 15px; }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        #result {
            margin-top: 15px;
            padding: 12px;
            background: #020617;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Smart Duka POS</h1>
        <p>AI-Powered Product Detection + Real-Time Inventory Sync (Elixir)</p>
    </div>

    <div class="layout">
        <div class="panel">
            <h2>Product Scanner (AI)</h2>
            <div class="scan-area">
                Camera Feed Area<br>
                <small>(Click scan to detect products via YOLO AI)</small>
            </div>
            <button onclick="scanProducts()">Scan Products (PyTorch AI)</button>
            <div id="detected_items"></div>
        </div>

        <div class="panel">
            <h2>Network Status (Elixir)</h2>
            <div id="result">
                <p>Scan products to see Elixir network activity.</p>
            </div>
        </div>
    </div>

    <script>
        const invoke = window.__TAURI_INTERNALS__.invoke;

        async function tajaPython(eventName, data) {
            let response = await invoke('tauri_to_python', {
                eventName: eventName,
                data: JSON.stringify(data)
            });
            return JSON.parse(response);
        }

        async function scanProducts() {
            let jibu = await tajaPython('scan_product', { image_path: 'camera_frame.jpg' });
            let container = document.getElementById('detected_items');
            let result = document.getElementById('result');

            if (jibu.status === 'success' && jibu.items.length > 0) {
                container.innerHTML = '<h3 style="color:#4ade80;">Bidhaa Zilizotambuliwa:</h3>';
                jibu.items.forEach(item => {
                    container.innerHTML += `
                        <div class="item-row">
                            <span>${item}</span>
                            <span style="color:#4ade80;">1,500 TZS</span>
                        </div>
                    `;
                });
                result.style.display = 'block';
                result.style.color = '#4ade80';
                result.innerText = `[Elixir] Mauzo mapya yamesambazwa kwenye maduka yote! Bidhaa: ${jibu.items.join(', ')}`;
            } else {
                container.innerHTML = '<p style="color:#ef4444;">Hakuna bidhaa iliyotambuliwa</p>';
            }
        }
    </script>
</body>
</html>
