apiVersion: v1
kind: Service
metadata:
  name: testapp-service
  labels:
    app: testapp
spec:
  type: ClusterIP
  selector:
    app: testapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
