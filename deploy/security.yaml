# PyTreXT Security Hardening Configuration
security:
  # Rate Limiting
  rate_limit:
    enabled: true
    max_requests: 100
    window_seconds: 60

  # CORS
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE"]
    allowed_headers: ["Content-Type", "Authorization"]

  # SSL/TLS
  ssl:
    enabled: true
    min_tls_version: "1.2"
    hsts_enabled: true
    hsts_max_age: 31536000

  # Secrets
  secrets:
    encryption: "AES-256-GCM"
    key_rotation_days: 90
    vault_enabled: true

  # Headers
  headers:
    x_frame_options: "SAMEORIGIN"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"
    referrer_policy: "strict-origin-when-cross-origin"
    content_security_policy: "default-src 'self'"

  # Database
  database:
    encryption: "AES-256"
    connection_encryption: true
    max_connections: 10
    backup_enabled: true
    backup_interval_hours: 24

  # Authentication
  auth:
    min_password_length: 12
    bcrypt_rounds: 12
    token_expiry_hours: 24
    mfa_enabled: false

  # Logging
  logging:
    redact_sensitive: true
    sensitive_fields:
      - password
      - secret
      - token
      - api_key
      - auth
