# ═══════════════════════════════════════════════════════════════
#  T-PYTREXT SERVERLESS — Google Cloud Run
#  Deploy: gcloud run deploy t-pytrext --source . --region us-central1
# ═══════════════════════════════════════════════════════════════

# Cloud Run Service Definition
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: t-pytrext
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/t-pytrext
          ports:
            - containerPort: 8080
          env:
            - name: PYTREX_ENV
              value: production
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
