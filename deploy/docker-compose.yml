# PyTreXT Production Stack
version: '3.8'

services:
  # ─── Main App ───
  testapp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: testapp:1.0.0
    container_name: testapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTREX_ENV=production
      - PYTREX_PORT=8080
      - PYTREX_LOG_LEVEL=INFO
      - PYTREX_DB_PATH=/data/pytrex.db
      - PYTREX_AUTH_SECRET=${PYTREX_AUTH_SECRET:-change-me-in-production}
    volumes:
      - pytrex_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    networks:
      - pytrex_net

  # ─── Elixir Engine (optional) ───
  testapp-elixir:
    image: hexpm/elixir:1.16-erlang-26
    container_name: testapp-elixir
    restart: unless-stopped
    command: sh -c "cd /app/pytrex_engine && mix deps.get && mix run --no-halt"
    volumes:
      - ../pytrex_engine:/app/pytrex_engine
    networks:
      - pytrex_net
    profiles:
      - full

  # ─── Nginx Reverse Proxy (optional) ───
  nginx:
    image: nginx:alpine
    container_name: testapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - testapp
    networks:
      - pytrex_net
    profiles:
      - proxy

networks:
  pytrex_net:
    driver: bridge

volumes:
  pytrex_data:
  certbot_data:
