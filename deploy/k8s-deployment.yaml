apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  labels:
    app: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: test
          image: test:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: PYTREX_ENV
              value: "production"
            - name: PYTREX_PORT
              value: "9000"
            - name: PYTREX_LOG_LEVEL
              value: "INFO"
            - name: PYTREX_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: test-secrets
                  key: auth-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512m"
              cpu: "1.0"
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
