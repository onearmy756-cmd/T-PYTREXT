[package]
name = "my_framework"
version = "1.0.0"
edition = "2021"

[lib]
name = "my_framework"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
tauri = { version = "2", features = ["wry"] }
libc = "0.2"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
rmp-serde = "1.3"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
flate2 = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
qrcode = "0.14"
image = "0.25"

# === PyTreXT Extended: Tokio + Axum HTTP Server ===
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# === PyTreXT Extended: Candle ML (HuggingFace Rust) ===
candle-core = "0.7"
candle-nn = "0.7"
candle-transformers = "0.7"
tokenizers = "0.20"

# === PyTreXT Extended: Burn ML (Rust Deep Learning) ===
burn = { version = "0.14", features = ["ndarray", "train"] }

# === PyTreXT Extended: MCP & Utilities ===
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
thiserror = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[build-dependencies]
tauri-build = { version = "2", features = [] }


